[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "system-coherence"
dynamic = ["version"]
description = "An artifact-backed Agent Skill framework for behavioral coherence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "System Coherence contributors" }]
dependencies = []
optional-dependencies.dev = ["build>=1.2.2"]
keywords = ["agent-skills", "software-architecture", "software-testing", "coherence"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/MPSMeridiaN/Auditor"
Repository = "https://github.com/MPSMeridiaN/Auditor"
Documentation = "https://github.com/MPSMeridiaN/Auditor/tree/main/docs"
Issues = "https://github.com/MPSMeridiaN/Auditor/issues"
Changelog = "https://github.com/MPSMeridiaN/Auditor/blob/main/CHANGELOG.md"
Security = "https://github.com/MPSMeridiaN/Auditor/blob/main/SECURITY.md"

[project.scripts]
coherence = "coherence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "coherence._version.__version__"}
