name: test

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate skills
        run: coherence validate-skills --json .
      - name: Run trusted fixture evaluations
        run: coherence eval --trusted-fixtures --json .
      - name: Generate disposable dogfood workspace
        run: python scripts/dogfood.py
      - name: Validate dogfood workspace
        run: coherence validate --json .
      - name: Check resumable route
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          result = subprocess.run(
              ["coherence", "route", "--json", "."],
              check=False,
              capture_output=True,
              text=True,
          )
          print(result.stdout, end="")
          payload = json.loads(result.stdout)
          if result.returncode or payload.get("stage") != "complete":
              print(result.stderr, file=sys.stderr, end="")
              raise SystemExit(1)
          PY
      - name: Run strict environment diagnostics
        run: coherence doctor --strict --json .

  release-check:
    name: Release boundary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install package and release tooling
        run: python -m pip install -e ".[dev]"
      - name: Verify public skill discovery
        run: npx --yes skills add . --list
      - name: Verify packages, skill archive, and clean installs
        run: coherence release-check --json --output-dir dist
      - name: Upload release-check evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-check-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
