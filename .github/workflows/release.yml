name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify release boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install package and release tooling
        run: python -m pip install -e ".[dev]"
      - name: Verify tag and package versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != expected:
              raise SystemExit(f"tag {expected!r} does not match project version {version!r}")
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate skills and fixture evaluations
        run: |
          coherence validate-skills --json .
          coherence eval --json .
      - name: Generate and validate dogfood route
        run: |
          python scripts/dogfood.py
          coherence validate --json .
          coherence route --json .
          coherence doctor --strict --json .
      - name: Verify public skill discovery
        run: npx --yes skills add . --list
      - name: Build and inspect release assets
        run: coherence release-check --json --output-dir dist
      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified assets
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "System Coherence $RELEASE_TAG" \
              --notes "Automated release. Assets passed the full test, fixture-evaluation, skill-discovery, package-boundary, clean-install, and checksum verification gates."
          fi
