<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Agents hand off through durable coherence artifacts</title>
  <desc id="desc">Agent A writes an artifact into the target repository's .coherence workspace. If the session stops, Agent B reads the artifact and resumes the work from the durable record.</desc>
  <defs>
    <pattern id="paper-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#e8e0d3" stroke-width="1" opacity=".55"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" fill="none" stroke="#1f5ba8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-coral" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" fill="none" stroke="#c64f43" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="760" rx="28" fill="#f8f5ed"/>
  <rect x="18" y="18" width="1404" height="724" rx="22" fill="url(#paper-grid)"/>

  <g font-family="'Segoe Print','Bradley Hand','Comic Sans MS',sans-serif" fill="#20272f">
    <text x="58" y="72" font-size="31" font-weight="700" letter-spacing="1">AGENTS CAN CHANGE. THE BEHAVIORAL MEMORY STAYS.</text>
    <text x="60" y="106" font-size="18" fill="#65717b">The handoff lives in the repository, not in the previous conversation.</text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M247 194C450 92 990 92 1194 194" fill="none" stroke="#c64f43" stroke-width="4" stroke-dasharray="12 11" marker-end="url(#arrow-coral)"/>
    <path d="M247 194C450 92 990 92 1194 194" fill="none" stroke="#fffdf8" stroke-width="1" opacity=".45"/>

    <rect x="60" y="250" width="192" height="220" rx="20" fill="#eef4fb" stroke="#1f5ba8" stroke-width="4" transform="rotate(-1 156 360)"/>
    <rect x="322" y="282" width="214" height="156" rx="16" fill="#fffdf8" stroke="#1f5ba8" stroke-width="4" transform="rotate(.7 429 360)"/>
    <rect x="580" y="198" width="280" height="340" rx="18" fill="#fff7df" stroke="#c64f43" stroke-width="4" transform="rotate(-.5 720 368)"/>
    <rect x="904" y="282" width="214" height="156" rx="16" fill="#fffdf8" stroke="#1f5ba8" stroke-width="4" transform="rotate(-.6 1011 360)"/>
    <rect x="1188" y="250" width="192" height="220" rx="20" fill="#eef7f0" stroke="#2a7a5b" stroke-width="4" transform="rotate(1 1284 360)"/>

    <path d="M252 360h63M536 360h40M860 360h38M1118 360h64" fill="none" stroke="#1f5ba8" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M612 260h216l28 26v202H612z" fill="#f2ddb0" stroke="#7d5b2e" stroke-width="3"/>
    <path d="M612 260h74l28 26h142" fill="none" stroke="#7d5b2e" stroke-width="3"/>
    <rect x="638" y="327" width="164" height="42" rx="8" fill="#fffdf8" stroke="#1f5ba8" stroke-width="3"/>
    <rect x="638" y="388" width="164" height="42" rx="8" fill="#fffdf8" stroke="#1f5ba8" stroke-width="3"/>
    <path d="M660 350h88M660 411h104" fill="none" stroke="#1f5ba8" stroke-width="4"/>
    <path d="M773 342l10 10 17-22M773 403l10 10 17-22" fill="none" stroke="#2a7a5b" stroke-width="4"/>
  </g>

  <g font-family="'Segoe Print','Bradley Hand','Comic Sans MS',sans-serif" fill="#20272f" text-anchor="middle">
    <text x="156" y="304" font-size="25" font-weight="700" fill="#1f5ba8">AGENT A</text>
    <text x="156" y="352" font-size="20">inspect</text>
    <text x="156" y="382" font-size="20">reason</text>
    <text x="156" y="412" font-size="20">write</text>
    <text x="429" y="330" font-size="23" font-weight="700" fill="#1f5ba8">ARTIFACT</text>
    <text x="429" y="374" font-size="18">system model</text>
    <text x="429" y="404" font-size="18">or finding</text>
    <text x="720" y="236" font-size="25" font-weight="700" fill="#c64f43">.coherence/</text>
    <text x="720" y="470" font-size="18" fill="#7d5b2e">durable record</text>
    <text x="1011" y="330" font-size="23" font-weight="700" fill="#1f5ba8">ARTIFACT</text>
    <text x="1011" y="374" font-size="18">read current</text>
    <text x="1011" y="404" font-size="18">handoff</text>
    <text x="1284" y="304" font-size="25" font-weight="700" fill="#2a7a5b">AGENT B</text>
    <text x="1284" y="352" font-size="20">resume</text>
    <text x="1284" y="382" font-size="20">revalidate</text>
    <text x="1284" y="412" font-size="20">continue</text>
    <text x="720" y="145" font-size="20" fill="#c64f43">interrupt here ↺</text>
    <text x="720" y="635" font-size="24" fill="#c64f43">new session → same evidence → next safe stage</text>
  </g>
</svg>
