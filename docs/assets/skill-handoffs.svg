<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">System Coherence artifact handoffs</title>
  <desc id="desc">Installed Agent Skills pass durable artifacts through a sequence of stages into the target repository's .coherence workspace, where later sessions resume and revalidate from the files.</desc>
  <defs>
    <pattern id="paper-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#e7e0d3" stroke-width="1" opacity=".55"/>
    </pattern>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#1757a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#c94d3f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="760" rx="26" fill="#f8f5ed"/>
  <rect x="18" y="18" width="1244" height="724" rx="20" fill="url(#paper-grid)"/>

  <g font-family="'Segoe Print', 'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#1c2229">
    <text x="54" y="64" font-size="30" font-weight="700" letter-spacing="1">ARTIFACTS ARE THE SHARED MEMORY</text>
    <text x="56" y="91" font-size="17" fill="#5b6570">Independent reasoning stages. Durable handoffs. No hidden conversation state.</text>
  </g>

  <g filter="url(#rough)">
    <!-- Installed skills panel -->
    <rect x="48" y="124" width="300" height="500" rx="20" fill="#eef4fb" stroke="#1757a6" stroke-width="4" transform="rotate(-.6 198 374)"/>
    <path d="M 72 184 C 143 178 238 188 323 181" fill="none" stroke="#c94d3f" stroke-width="3" stroke-linecap="round"/>
    <rect x="78" y="205" width="238" height="58" rx="12" fill="#dceafa" stroke="#1757a6" stroke-width="3"/>
    <rect x="78" y="286" width="238" height="52" rx="12" fill="#fffdf8" stroke="#1757a6" stroke-width="3"/>
    <rect x="78" y="357" width="238" height="52" rx="12" fill="#fffdf8" stroke="#1757a6" stroke-width="3"/>
    <rect x="78" y="428" width="238" height="52" rx="12" fill="#fffdf8" stroke="#1757a6" stroke-width="3"/>
    <rect x="78" y="499" width="238" height="52" rx="12" fill="#fffdf8" stroke="#1757a6" stroke-width="3"/>

    <!-- Handoff lane -->
    <path d="M 350 255 C 385 255 395 255 430 255" fill="none" stroke="#1757a6" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M 350 385 C 385 385 395 385 430 385" fill="none" stroke="#1757a6" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M 350 515 C 385 515 395 515 430 515" fill="none" stroke="#1757a6" stroke-width="4" marker-end="url(#arrow-blue)"/>

    <rect x="430" y="124" width="384" height="500" rx="20" fill="#fffdf8" stroke="#252b31" stroke-width="4" transform="rotate(.5 622 374)"/>
    <path d="M 458 184 C 552 191 682 178 785 186" fill="none" stroke="#1757a6" stroke-width="3" stroke-linecap="round"/>

    <!-- Artifact cards -->
    <g fill="#f5f8fc" stroke="#1757a6" stroke-width="3">
      <rect x="480" y="207" width="286" height="46" rx="9"/>
      <rect x="480" y="270" width="286" height="46" rx="9"/>
      <rect x="480" y="333" width="286" height="46" rx="9"/>
      <rect x="480" y="396" width="286" height="46" rx="9"/>
      <rect x="480" y="459" width="286" height="46" rx="9"/>
      <rect x="480" y="522" width="286" height="46" rx="9"/>
    </g>

    <!-- Repository panel -->
    <rect x="866" y="124" width="366" height="500" rx="20" fill="#fff7df" stroke="#c94d3f" stroke-width="4" transform="rotate(-.4 1049 374)"/>
    <path d="M 890 184 C 982 178 1101 189 1209 181" fill="none" stroke="#1757a6" stroke-width="3" stroke-linecap="round"/>
    <path d="M 917 230 h 86 l 20 18 h 183 v 262 h -289 z" fill="#f2ddb0" stroke="#7d5b2e" stroke-width="3"/>
    <path d="M 917 230 h 86 l 20 18 h 183" fill="none" stroke="#7d5b2e" stroke-width="3"/>
    <rect x="945" y="293" width="224" height="150" rx="10" fill="#fffdf8" stroke="#252b31" stroke-width="3"/>
    <path d="M 973 332 h 122 M 973 365 h 146 M 973 398 h 92" fill="none" stroke="#1757a6" stroke-width="4" stroke-linecap="round"/>
    <path d="M 1107 330 l 12 12 22 -26 M 1107 364 l 12 12 22 -26 M 1107 398 l 12 12 22 -26" fill="none" stroke="#c94d3f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 946 476 h 221" fill="none" stroke="#7d5b2e" stroke-width="3" stroke-dasharray="7 8"/>

    <!-- Repository loop -->
    <path d="M 1046 532 C 1042 640 918 690 745 681 C 557 671 340 674 202 624 C 131 598 104 571 104 549" fill="none" stroke="#c94d3f" stroke-width="4" marker-end="url(#arrow-coral)"/>
  </g>

  <g font-family="'Segoe Print', 'Comic Sans MS', 'Trebuchet MS', sans-serif" fill="#1c2229">
    <text x="76" y="160" font-size="22" font-weight="700" fill="#1757a6">INSTALLED SKILLS</text>
    <text x="92" y="241" font-size="20" font-weight="700">system-coherence</text>
    <text x="98" y="319" font-size="18">reconstruct-system</text>
    <text x="117" y="390" font-size="18">model-behavior</text>
    <text x="116" y="461" font-size="18">audit-coherence</text>
    <text x="93" y="532" font-size="18">revalidate-coherence</text>
    <text x="116" y="590" font-size="16" fill="#5b6570">+ other specialists</text>

    <text x="460" y="160" font-size="22" font-weight="700">DURABLE HANDOFFS</text>
    <text x="496" y="237" font-size="19">system model</text>
    <text x="496" y="300" font-size="19">capability map</text>
    <text x="496" y="363" font-size="19">behavioral contracts</text>
    <text x="496" y="426" font-size="19">states + transitions</text>
    <text x="496" y="489" font-size="19">implementation traces</text>
    <text x="496" y="552" font-size="19">findings → ledger</text>
    <text x="471" y="598" font-size="16" fill="#c94d3f">each stage reads the current files</text>

    <text x="894" y="160" font-size="22" font-weight="700" fill="#c94d3f">TARGET REPOSITORY</text>
    <text x="951" y="281" font-size="25" font-weight="700">.coherence/</text>
    <text x="959" y="525" font-size="18">artifacts are the record</text>
    <text x="934" y="596" font-size="17" fill="#c94d3f">resume / revalidate ↺</text>
  </g>
</svg>
