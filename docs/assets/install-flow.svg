<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Install the System Coherence suite</title>
  <desc id="desc">A GitHub repository URL passes through an Agent Skills installer, copies ten skills into the target repository, and starts at the system-coherence orchestrator.</desc>
  <defs>
    <pattern id="paper-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#e8e0d3" stroke-width="1" opacity=".55"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" fill="none" stroke="#1f5ba8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="440" rx="28" fill="#f8f5ed"/>
  <rect x="18" y="18" width="1404" height="404" rx="22" fill="url(#paper-grid)"/>

  <g font-family="'Segoe Print','Bradley Hand','Comic Sans MS',sans-serif" fill="#20272f">
    <text x="58" y="70" font-size="31" font-weight="700" letter-spacing="1">ONE URL. TEN SKILLS. A RUNNABLE START.</text>
    <text x="60" y="103" font-size="18" fill="#65717b">Copy the methodology into the repository you want to understand.</text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <g fill="#fffdf8" stroke="#1f5ba8" stroke-width="4">
      <rect x="54" y="166" width="234" height="164" rx="19" transform="rotate(-.7 171 248)"/>
      <rect x="334" y="166" width="234" height="164" rx="19" transform="rotate(.5 451 248)"/>
      <rect x="614" y="166" width="234" height="164" rx="19" transform="rotate(-.4 731 248)"/>
      <rect x="894" y="166" width="234" height="164" rx="19" transform="rotate(.6 1011 248)"/>
      <rect x="1174" y="166" width="234" height="164" rx="19" transform="rotate(-.5 1291 248)"/>
    </g>
    <path d="M288 248h44M568 248h44M848 248h44M1128 248h44" fill="none" stroke="#1f5ba8" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M84 300h174M364 300h174M644 300h174M924 300h174M1204 300h174" fill="none" stroke="#c64f43" stroke-width="3" stroke-dasharray="7 8"/>
  </g>

  <g font-family="'Segoe Print','Bradley Hand','Comic Sans MS',sans-serif" fill="#20272f" text-anchor="middle">
    <g font-size="22" font-weight="700">
      <text x="171" y="211" fill="#1f5ba8">GITHUB URL</text>
      <text x="451" y="211" fill="#1f5ba8">AGENT SKILLS</text>
      <text x="731" y="211" fill="#1f5ba8">10 SKILLS</text>
      <text x="1011" y="211" fill="#1f5ba8">TARGET REPO</text>
      <text x="1291" y="211" fill="#c64f43">START HERE</text>
    </g>
    <g font-size="19">
      <text x="171" y="253">published source</text>
      <text x="451" y="253">installer copies</text>
      <text x="731" y="253">complete suite</text>
      <text x="1011" y="253">self-contained</text>
      <text x="1291" y="253">system-coherence</text>
    </g>
    <g font-size="16" fill="#65717b">
      <text x="171" y="282">use the exact URL</text>
      <text x="451" y="282">--copy</text>
      <text x="731" y="282">orchestrated route</text>
      <text x="1011" y="282">.coherence/ is local</text>
      <text x="1291" y="282">invoke the skill</text>
    </g>
  </g>
</svg>
