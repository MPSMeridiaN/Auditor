<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Ordinary review versus System Coherence</title>
  <desc id="desc">Three files can each look correct while the user interface, state, domain, persistence, and external systems disagree. System Coherence follows the behavior between the layers.</desc>
  <defs>
    <pattern id="paper-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#e8e0d3" stroke-width="1" opacity=".55"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11" fill="none" stroke="#1f5ba8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="760" rx="28" fill="#f8f5ed"/>
  <rect x="18" y="18" width="1404" height="724" rx="22" fill="url(#paper-grid)"/>

  <g font-family="'Segoe Print','Bradley Hand','Comic Sans MS',sans-serif" fill="#20272f">
    <text x="58" y="72" font-size="31" font-weight="700" letter-spacing="1">EVERY FILE CAN PASS. THE SYSTEM CAN STILL DISAGREE.</text>
    <text x="60" y="105" font-size="18" fill="#65717b">Local correctness is not the same thing as a coherent end-to-end behavior.</text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="56" y="146" width="552" height="524" rx="24" fill="#eef4fb" stroke="#1f5ba8" stroke-width="4" transform="rotate(-.5 332 408)"/>
    <rect x="832" y="146" width="552" height="524" rx="24" fill="#fff7df" stroke="#c64f43" stroke-width="4" transform="rotate(.5 1108 408)"/>

    <path d="M84 202C228 194 406 207 578 199" fill="none" stroke="#c64f43" stroke-width="3"/>
    <path d="M860 202C1002 207 1202 194 1356 203" fill="none" stroke="#1f5ba8" stroke-width="3"/>

    <g fill="#fffdf8" stroke="#1f5ba8" stroke-width="3">
      <rect x="106" y="250" width="452" height="74" rx="13"/>
      <rect x="106" y="346" width="452" height="74" rx="13"/>
      <rect x="106" y="442" width="452" height="74" rx="13"/>
    </g>
    <g fill="none" stroke="#2a7a5b" stroke-width="5">
      <path d="M505 278l12 12 23-29"/>
      <path d="M505 374l12 12 23-29"/>
      <path d="M505 470l12 12 23-29"/>
    </g>
    <path d="M106 566C224 550 420 582 558 564" fill="none" stroke="#c64f43" stroke-width="3" stroke-dasharray="8 10"/>

    <g fill="#fffdf8" stroke="#20272f" stroke-width="3">
      <rect x="868" y="246" width="136" height="116" rx="15"/>
      <rect x="1040" y="246" width="136" height="116" rx="15"/>
      <rect x="1212" y="246" width="136" height="116" rx="15"/>
      <rect x="954" y="430" width="136" height="116" rx="15"/>
      <rect x="1126" y="430" width="136" height="116" rx="15"/>
    </g>
    <path d="M1004 304h36M1176 304h36M1090 488h36" fill="none" stroke="#1f5ba8" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M1279 362v48M1022 430v-32h378v32" fill="none" stroke="#1f5ba8" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <path d="M1176 488h-86" fill="none" stroke="#c64f43" stroke-width="5" stroke-dasharray="10 9"/>
    <path d="M1160 460l26 28-26 28" fill="none" stroke="#c64f43" stroke-width="5"/>
  </g>

  <g font-family="'Segoe Print','Bradley Hand','Comic Sans MS',sans-serif" fill="#20272f">
    <text x="88" y="184" font-size="25" font-weight="700" fill="#1f5ba8">ORDINARY REVIEW</text>
    <text x="132" y="294" font-size="26" font-weight="700">file A</text>
    <text x="132" y="390" font-size="26" font-weight="700">file B</text>
    <text x="132" y="486" font-size="26" font-weight="700">file C</text>
    <text x="132" y="612" font-size="23" fill="#2a7a5b">✓ looks correct, locally</text>
    <text x="864" y="184" font-size="25" font-weight="700" fill="#c64f43">SYSTEM COHERENCE</text>
    <text x="901" y="316" font-size="21" font-weight="700">UI</text>
    <text x="1062" y="316" font-size="21" font-weight="700">STATE</text>
    <text x="1219" y="316" font-size="21" font-weight="700">DOMAIN</text>
    <text x="971" y="500" font-size="20" font-weight="700">PERSISTENCE</text>
    <text x="1142" y="500" font-size="20" font-weight="700">EXTERNAL</text>
    <text x="920" y="610" font-size="23" fill="#c64f43">↯ follows the disagreement between layers</text>
    <text x="634" y="412" font-size="21" fill="#c64f43" text-anchor="middle" transform="rotate(-8 634 412)">the bug lives here</text>
    <path d="M698 392C760 370 790 356 830 330" fill="none" stroke="#c64f43" stroke-width="4" marker-end="url(#arrow-blue)"/>
  </g>
</svg>
